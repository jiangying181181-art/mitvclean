name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 离线测试
        run: python tests/test_offline.py

      - name: CLI 冒烟
        run: |
          python -m mitvclean.cli profiles
          python -m mitvclean.cli --help
          python -m mitvclean.cli hosts --profile mitv-ansp0 --out /tmp/mitv-smoke
          test -s /tmp/mitv-smoke/hosts-mitv-ansp0.txt
